<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuna Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3F7;--ink:#14182B;--muted:#667089;--indigo:#26337A;--indigo2:#1B2559;--gold:#E3A92B;--card:#fff;--line:#DCE0EA;--ok:#1E7B4F;--err:#B3352B;--r:10px}
*{box-sizing:border-box;margin:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;min-height:100vh}
h1,h2,h3,.brand{font-family:'Reem Kufi','Tajawal',sans-serif;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.btn{background:var(--indigo);color:#fff;border:0;border-radius:var(--r);padding:11px 20px;font-weight:700;transition:background .15s}
.btn:hover{background:var(--indigo2)}.btn:disabled{background:#B9BFD3;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{background:#d19a22}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#fff}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 5px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:11px 13px;background:#fff}
input:focus,textarea:focus{border-color:var(--indigo);outline:none}
.err{color:var(--err);font-size:14px;margin-top:12px;min-height:21px}

/* Auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.hero{background:var(--indigo);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
 repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.045) 22px 23px),
 repeating-linear-gradient(-45deg,transparent 0 22px,rgba(255,255,255,.045) 22px 23px)}
.hero>*{position:relative}
.brand{font-size:34px;letter-spacing:.5px}
.brand i{font-style:normal;color:var(--gold)}
.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.25;max-width:12em}
.hero p{margin-top:16px;color:#C9D0EE;max-width:26em}
.hero ul{list-style:none;padding:0;display:flex;gap:10px;flex-wrap:wrap}
.hero li{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 14px;font-size:14px}
.formside{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.box{width:100%;max-width:400px}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:8px}
.tabs button{flex:1;background:none;border:0;padding:12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--indigo);border-color:var(--gold)}

/* Shop */
header{position:sticky;top:0;z-index:20;background:var(--indigo);color:#fff}
.bar{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.bar .brand{font-size:26px;flex:1}
.hi{font-size:14px;color:#C9D0EE}
.cartbtn{position:relative;background:var(--gold);color:var(--ink);border:0;border-radius:var(--r);padding:8px 16px;font-weight:700}
.badge{position:absolute;top:-8px;left:-8px;background:#fff;color:var(--indigo);border-radius:99px;min-width:22px;height:22px;font-size:13px;display:grid;place-items:center;border:2px solid var(--indigo)}
.linkbtn{background:none;border:0;color:#fff;text-decoration:underline;font-size:14px}
main{max-width:1180px;margin:auto;padding:24px 20px 60px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.tools input{max-width:280px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 16px;font-size:14px}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;background:linear-gradient(135deg,#DDE2F3,#F4E7C4);display:grid;place-items:center;font-size:44px;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;right:10px;background:#fff;border-radius:99px;padding:1px 12px;font-size:13px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{font-size:18px;line-height:1.35}
.body p{color:var(--muted);font-size:14px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.price{font-weight:700;font-size:18px;color:var(--indigo)}
.soldout{color:var(--err);font-size:14px;font-weight:700}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.qty button{width:34px;height:34px;border:0;background:#fff;font-size:18px}
.qty button:hover{background:var(--bg)}
.qty span{min-width:30px;text-align:center;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:60px 0}

/* Drawer */
.veil{position:fixed;inset:0;background:rgba(20,24,43,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(440px,100%);background:#fff;z-index:50;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dh h2{font-size:22px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}
.db{flex:1;overflow:auto;padding:8px 20px 20px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item .n{flex:1;font-weight:500}.item .n small{display:block;color:var(--muted)}
.rm{background:none;border:0;color:var(--err);font-size:13px}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:16px 0 4px}
.df{padding:14px 20px;border-top:1px solid var(--line)}

/* Success + toast */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(20,24,43,.6);padding:20px}
.mbox{background:#fff;border-radius:14px;padding:34px 28px;max-width:400px;text-align:center}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
.mbox h2{font-size:26px}.mbox p{color:var(--muted);margin:8px 0 20px}
.oid{font-family:'Reem Kufi';font-size:20px;color:var(--indigo);background:var(--bg);border-radius:8px;padding:4px 12px;display:inline-block;margin-top:6px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:90}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--indigo);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:820px){#auth{grid-template-columns:1fr}.hero{padding:28px 24px;gap:24px}.hero ul{display:none}.hi{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="loader" id="loader"><div class="spin"></div></div>

<!-- تسجيل الدخول / إنشاء حساب -->
<section id="auth" class="hidden">
  <div class="hero">
    <div class="brand">Tuna <i>Crafts</i></div>
    <div>
      <h1>شغل إيد، بتفاصيل بتحكي حكاية</h1>
      <p>سيراميك، كروشيه، شموع وخشب. كل قطعة بتتعمل بإيد صانعها وبتوصلك لحد البيت.</p>
    </div>
    <ul><li>سيراميك</li><li>كروشيه</li><li>شموع</li><li>خشب</li></ul>
  </div>
  <div class="formside"><div class="box">
    <div class="tabs" role="tablist">
      <button id="tabLogin" class="on" role="tab">تسجيل الدخول</button>
      <button id="tabSignup" role="tab">حساب جديد</button>
    </div>
    <form id="fLogin" autocomplete="on">
      <label for="le">الإيميل</label><input id="le" type="email" autocomplete="email" required>
      <label for="lp">كلمة السر</label><input id="lp" type="password" autocomplete="current-password" required>
      <div class="err" id="lerr"></div>
      <button class="btn block" id="lbtn">دخول</button>
    </form>
    <form id="fSignup" class="hidden" autocomplete="on">
      <label for="sn">الاسم بالكامل</label><input id="sn" autocomplete="name" required>
      <label for="se">الإيميل</label><input id="se" type="email" autocomplete="email" required>
      <label for="sp">رقم الموبايل</label><input id="sp" type="tel" autocomplete="tel" required>
      <label for="sw">كلمة السر (6 على الأقل)</label><input id="sw" type="password" autocomplete="new-password" minlength="6" required>
      <div class="err" id="serr"></div>
      <button class="btn block" id="sbtn">إنشاء الحساب</button>
    </form>
  </div></div>
</section>

<!-- المتجر -->
<section id="shop" class="hidden">
  <header><div class="bar">
    <div class="brand">Tuna <span style="color:var(--gold)">Crafts</span></div>
    <span class="hi" id="hi"></span>
    <button class="linkbtn" id="out">خروج</button>
    <button class="cartbtn" id="openCart" aria-label="فتح السلة">السلة<span class="badge" id="cnt">0</span></button>
  </div></header>
  <main>
    <div class="tools">
      <input id="q" type="search" placeholder="ابحث عن منتج" aria-label="بحث">
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</section>

<!-- السلة -->
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="السلة">
  <div class="dh"><h2>سلة المشتريات</h2><button class="x" id="closeCart" aria-label="إغلاق">×</button></div>
  <div class="db" id="cartBody"></div>
  <div class="df hidden" id="cartFoot">
    <div class="sum"><span>الإجمالي</span><span id="total"></span></div>
    <form id="fOrder">
      <label for="op">رقم الموبايل</label><input id="op" type="tel" required>
      <label for="oa">العنوان بالتفصيل</label><textarea id="oa" rows="2" required></textarea>
      <label for="on">ملاحظات (اختياري)</label><input id="on">
      <div class="err" id="oerr"></div>
      <button class="btn gold block" id="obtn">تأكيد الطلب</button>
    </form>
  </div>
</aside>

<div class="modal hidden" id="done"><div class="mbox">
  <div class="tick">✓</div><h2>تم استلام طلبك</h2>
  <p>بعتنالك تأكيد على الإيميل وهنتواصل معاك قريب لتحديد ميعاد التوصيل.<br><span class="oid" id="oid"></span></p>
  <button class="btn block" id="doneBtn">كمّل تسوق</button>
</div></div>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString('en-US') + ' ج.م';
// ← الصق هنا رابط Web app URL بتاع Apps Script
const API_URL = 'https://script.google.com/macros/s/AKfycbwaq-KryE0f_vg_PJzQr9z45EXO_a1ktFPyzS7pYlRUxuVYK4Ab1dDPa1oSQzJnsEDr/exec';
const api = (fn, ...args) => fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ fn, args }) }).then(r => r.json());
const icons = {'سيراميك':'🏺','كروشيه':'🧶','شموع':'🕯️','خشب':'🪵'};

let S = { token: store.get('tc_token'), user: null, products: [], cart: {}, cat: 'الكل', q: '' };
try { S.cart = JSON.parse(store.get('tc_cart') || '{}'); } catch(e){}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2200); }
function busy(btn, on, txt){ btn.disabled = on; if(txt){ btn.dataset.t = btn.dataset.t || btn.textContent; btn.textContent = on ? txt : btn.dataset.t; } }
const saveCart = () => store.set('tc_cart', JSON.stringify(S.cart));

/* ---------- بدء التشغيل ---------- */
async function init(){
  if (S.token) {
    try { const r = await api('checkSession', S.token); if (r.ok) { S.user = r.user; return enterShop(); } } catch(e){}
    store.del('tc_token'); S.token = null;
  }
  showAuth();
}
function showAuth(){ $('#loader').classList.add('hidden'); $('#shop').classList.add('hidden'); $('#auth').classList.remove('hidden'); }
async function enterShop(){
  try {
    const r = await api('getProducts', S.token);
    if (!r.ok) { if (r.auth === false) return doLogout(); toast(r.msg); }
    S.products = r.products || [];
  } catch(e){ toast('تعذر تحميل المنتجات، حدّث الصفحة'); }
  // تنظيف السلة من منتجات لم تعد متاحة
  Object.keys(S.cart).forEach(id => { if(!S.products.find(p => p.id === id)) delete S.cart[id]; });
  $('#hi').textContent = 'أهلاً، ' + S.user.name.split(' ')[0];
  $('#op').value = S.user.phone || '';
  $('#auth').classList.add('hidden'); $('#shop').classList.remove('hidden'); $('#loader').classList.add('hidden');
  render(); renderCart();
}
function doLogout(){ api('logout', S.token).catch(()=>{}); store.del('tc_token'); S.token=null; S.user=null; closeCart(); showAuth(); }

/* ---------- تسجيل الدخول والحساب ---------- */
function tab(login){
  $('#tabLogin').classList.toggle('on', login); $('#tabSignup').classList.toggle('on', !login);
  $('#fLogin').classList.toggle('hidden', !login); $('#fSignup').classList.toggle('hidden', login);
}
$('#tabLogin').onclick = () => tab(true); $('#tabSignup').onclick = () => tab(false);

async function authDo(e, fn, data, errEl, btn, label){
  e.preventDefault(); errEl.textContent = ''; busy(btn, true, label);
  try {
    const r = await api(fn, data);
    if (!r.ok) { errEl.textContent = r.msg; busy(btn, false, label); return; }
    S.token = r.token; S.user = r.user; store.set('tc_token', r.token);
    $('#loader').classList.remove('hidden'); busy(btn, false, label); enterShop();
  } catch(x){ errEl.textContent = 'مشكلة في الاتصال، حاول تاني'; busy(btn, false, label); }
}
$('#fLogin').onsubmit = e => authDo(e, 'login', { email: $('#le').value, password: $('#lp').value }, $('#lerr'), $('#lbtn'), 'جاري الدخول...');
$('#fSignup').onsubmit = e => authDo(e, 'signup', { name: $('#sn').value, email: $('#se').value, phone: $('#sp').value, password: $('#sw').value }, $('#serr'), $('#sbtn'), 'جاري الإنشاء...');
$('#out').onclick = doLogout;

/* ---------- المنتجات ---------- */
function render(){
  const cats = ['الكل', ...new Set(S.products.map(p => p.category))];
  $('#chips').innerHTML = cats.map(c => `<button class="chip ${c===S.cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const q = S.q.trim().toLowerCase();
  const list = S.products.filter(p => (S.cat==='الكل' || p.category===S.cat) && (!q || (p.name+' '+p.description).toLowerCase().includes(q)));
  $('#grid').innerHTML = list.length ? list.map(card).join('') : '<div class="empty" style="grid-column:1/-1">مفيش منتجات مطابقة للبحث</div>';
}
function card(p){
  const n = S.cart[p.id] || 0;
  const pic = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : (icons[p.category] || '🎁');
  const act = p.stock < 1 ? '<span class="soldout">نفدت الكمية</span>'
    : n ? `<div class="qty"><button data-a="dec" data-id="${p.id}" aria-label="تقليل">−</button><span>${n}</span><button data-a="inc" data-id="${p.id}" aria-label="زيادة">+</button></div>`
    : `<button class="btn" data-a="add" data-id="${p.id}">أضف للسلة</button>`;
  return `<article class="card"><div class="pic">${pic}<span class="tag">${esc(p.category)}</span></div>
    <div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>
    <div class="row"><span class="price">${money(p.price)}</span>${act}</div></div></article>`;
}
function setQty(id, d){
  const p = S.products.find(x => x.id === id); if(!p) return;
  const n = Math.max(0, Math.min(p.stock, (S.cart[id]||0) + d));
  if ((S.cart[id]||0) + d > p.stock) toast('وصلت للكمية المتاحة');
  n ? S.cart[id] = n : delete S.cart[id];
  saveCart(); render(); renderCart();
}
$('#grid').onclick = e => { const b = e.target.closest('[data-a]'); if(!b) return; setQty(b.dataset.id, b.dataset.a==='dec' ? -1 : 1); };
$('#chips').onclick = e => { const b = e.target.closest('[data-c]'); if(!b) return; S.cat = b.dataset.c; render(); };
$('#q').oninput = e => { S.q = e.target.value; render(); };

/* ---------- السلة ---------- */
const openCart = () => { $('#drawer').classList.add('on'); $('#veil').classList.add('on'); };
const closeCart = () => { $('#drawer').classList.remove('on'); $('#veil').classList.remove('on'); };
$('#openCart').onclick = openCart; $('#closeCart').onclick = closeCart; $('#veil').onclick = closeCart;
document.addEventListener('keydown', e => { if(e.key==='Escape') closeCart(); });

function renderCart(){
  const items = Object.keys(S.cart).map(id => ({ p: S.products.find(x => x.id===id), n: S.cart[id] })).filter(x => x.p);
  const count = items.reduce((a,x) => a + x.n, 0), total = items.reduce((a,x) => a + x.n * x.p.price, 0);
  $('#cnt').textContent = count;
  $('#cartFoot').classList.toggle('hidden', !count);
  $('#total').textContent = money(total);
  $('#cartBody').innerHTML = count ? items.map(({p,n}) => `<div class="item">
      <div class="n">${esc(p.name)}<small>${money(p.price)} للقطعة</small></div>
      <div class="qty"><button data-a="dec" data-id="${p.id}" aria-label="تقليل">−</button><span>${n}</span><button data-a="inc" data-id="${p.id}" aria-label="زيادة">+</button></div>
      <button class="rm" data-a="del" data-id="${p.id}">حذف</button></div>`).join('')
    : '<div class="empty">السلة فاضية<br>ضيف منتجات من المتجر وارجع هنا لتأكيد الطلب</div>';
}
$('#cartBody').onclick = e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if (b.dataset.a==='del') { delete S.cart[b.dataset.id]; saveCart(); render(); renderCart(); }
  else setQty(b.dataset.id, b.dataset.a==='dec' ? -1 : 1);
};

$('#fOrder').onsubmit = async e => {
  e.preventDefault(); const err = $('#oerr'), btn = $('#obtn'); err.textContent = '';
  busy(btn, true, 'جاري إرسال الطلب...');
  try {
    const items = Object.keys(S.cart).map(id => ({ id, qty: S.cart[id] }));
    const r = await api('placeOrder', S.token, { items, phone: $('#op').value, address: $('#oa').value, notes: $('#on').value });
    if (!r.ok) {
      if (r.auth === false) { toast(r.msg); return doLogout(); }
      err.textContent = r.msg; busy(btn, false, 'x'); await refresh(); return;
    }
    S.cart = {}; saveCart(); $('#oa').value=''; $('#on').value='';
    closeCart(); $('#oid').textContent = r.orderId; $('#done').classList.remove('hidden');
    busy(btn, false, 'x'); await refresh();
  } catch(x){ err.textContent = 'مشكلة في الاتصال، الطلب لم يتم. حاول تاني'; busy(btn, false, 'x'); }
};
async function refresh(){ const r = await api('getProducts', S.token).catch(()=>null); if(r && r.ok){ S.products = r.products; Object.keys(S.cart).forEach(id => { const p=S.products.find(x=>x.id===id); if(!p||p.stock<1) delete S.cart[id]; else if(S.cart[id]>p.stock) S.cart[id]=p.stock; }); saveCart(); render(); renderCart(); } }
$('#doneBtn').onclick = () => $('#done').classList.add('hidden');

init();
</script>
</body>
</html>
